name: Peregrine
description: >-
  Peregrine Technologies is a public-safety operational-intelligence platform
  that unifies fragmented data sources into actionable context for law
  enforcement, corrections, fire-rescue, EMS, emergency management, and 911
  agencies. Its full-stack platform pairs Peregrine Foundation for data
  integration with Peregrine AI for analysis, surfacing connections across
  otherwise disconnected datasets to speed decision-making and situational
  awareness. FedRAMP High authorized and operating within AWS GovCloud, it is
  used by agencies including the Atlanta, Miami, and Edmonton police departments
  and Ada County Paramedics. The product is delivered as a login-gated
  enterprise/government SaaS with no public developer API surface at this time.
